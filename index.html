<!doctype html>

<head>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lis avec moi</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lis avec moi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Mise en page : une app plein écran, un écran à la fois, gros boutons pour petits doigts.
   Look volontairement unique (clair et vif), quel que soit le thème de l'appareil. */
:root {
  color-scheme: light;
  --ciel: #d8f3ee;          /* fond menthe */
  --ciel-2: #bfeae2;
  --encre: #243057;         /* texte */
  --encre-douce: #5a6488;
  --cadre: #7176d6;         /* bord des cadres, comme les étiquettes de l'école */
  --papier: #ffffff;
  --soleil: #ffb627;
  --orange: #ff8a3d;
  --vrai: #22b573;
  --vrai-fonce: #168a55;
  --faux: #f2545b;
  --faux-fonce: #c63a41;
  --ombre: 0 6px 0 rgba(36, 48, 87, .18);
  --f-titre: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --f-mot: "Andika", "Century Gothic", "Avenir Next", system-ui, sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--ciel);
  background-image:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,.55) 0 38px, transparent 39px),
    radial-gradient(circle at 88% 12%, rgba(255,182,39,.28) 0 54px, transparent 55px),
    radial-gradient(circle at 92% 86%, rgba(113,118,214,.18) 0 70px, transparent 71px),
    radial-gradient(circle at 6% 92%, rgba(242,84,91,.14) 0 48px, transparent 49px);
  color: var(--encre);
  font-family: var(--f-titre);
  font-size: 18px;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  overflow-x: hidden;
}
#app {
  min-height: 100%;
  box-sizing: border-box;
  display: flex; flex-direction: column;
  padding-block: 16px 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1100px; margin: 0 auto;
}
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 700; }
h1 { font-size: clamp(30px, 6vw, 52px); letter-spacing: .5px; }
h2 { font-size: clamp(24px, 4.5vw, 36px); }
p { margin: 0; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 4px solid var(--soleil); outline-offset: 3px; }
input[type="text"], input[type="url"], textarea {
  font: inherit; font-family: var(--f-mot); color: var(--encre);
  background: var(--papier); border: 3px solid var(--cadre); border-radius: 16px;
  padding: 14px 16px; width: 100%; box-sizing: border-box; font-size: 20px;
  -webkit-user-select: text; user-select: text;
}

/* barre du haut */
.barre { display: flex; align-items: center; gap: 12px; min-height: 64px; }
.barre .titre { flex: 1; min-width: 0; text-align: center; }
.rond {
  width: 64px; height: 64px; border-radius: 50%; flex: none;
  background: var(--papier); box-shadow: var(--ombre);
  display: grid; place-items: center; font-size: 28px;
}
.rond:active, .gros:active, .tuile:active, .duree:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(36,48,87,.18); }
.espace { width: 64px; flex: none; }

/* gros boutons */
.gros {
  min-height: 84px; padding: 0 28px; border-radius: 28px;
  font-size: clamp(24px, 4vw, 32px); font-weight: 700;
  background: var(--soleil); color: var(--encre); box-shadow: var(--ombre);
  display: inline-flex; align-items: center; justify-content: center; gap: 14px;
}
.gros.bleu { background: var(--cadre); color: #fff; }
.gros.vert { background: var(--vrai); color: #fff; }
.gros.blanc { background: var(--papier); }
.gros.petit { min-height: 60px; font-size: 20px; border-radius: 20px; padding: 0 20px; }
.gros[disabled] { opacity: .45; pointer-events: none; }

/* écran profils */
.centre { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 28px; }
.entete { text-align: center; display: grid; gap: 6px; }
.entete p { color: var(--encre-douce); font-size: clamp(18px, 3vw, 24px); font-weight: 500; }
.grille-profils { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 18px; max-width: 900px; width: 100%; margin: 0 auto; }
.tuile {
  background: var(--papier); border-radius: 30px; box-shadow: var(--ombre);
  padding: 18px 10px 16px; display: grid; justify-items: center; gap: 8px;
  border: 6px solid var(--c, var(--cadre)); min-height: 170px; align-content: center;
}
.tuile .avatar { font-size: 64px; line-height: 1; }
.tuile .nom { font-size: 24px; font-weight: 600; max-width: 100%; overflow-wrap: anywhere; }
.tuile.ajout { border-style: dashed; background: rgba(255,255,255,.6); color: var(--encre-douce); }
.tuile.ajout .avatar { font-size: 56px; font-weight: 700; color: var(--cadre); }
.bas { display: flex; justify-content: center; }
.copyright { text-align: center; color: var(--encre-douce); font-size: 14px; font-weight: 500; opacity: .8; margin: 4px 0 0; }
.lien-parents { background: transparent; color: var(--encre-douce); font-size: 18px; font-weight: 600; padding: 14px 18px; border-radius: 14px; }

/* création de profil */
.panneau { background: var(--papier); border-radius: 30px; box-shadow: var(--ombre); padding: 22px; display: grid; gap: 18px; max-width: 760px; width: 100%; margin: 0 auto; box-sizing: border-box; }
.etiquette { font-size: 18px; font-weight: 600; color: var(--encre-douce); }
.choix-animaux { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px; }
.choix-animaux button { height: 72px; border-radius: 20px; background: var(--ciel); font-size: 40px; border: 4px solid transparent; }
.choix-animaux button[aria-pressed="true"] { border-color: var(--cadre); background: #fff7e0; }
.choix-couleurs { display: flex; flex-wrap: wrap; gap: 12px; }
.choix-couleurs button { width: 60px; height: 60px; border-radius: 50%; background: var(--c); border: 5px solid #fff; box-shadow: 0 0 0 3px transparent; }
.choix-couleurs button[aria-pressed="true"] { box-shadow: 0 0 0 4px var(--encre); }

/* choix du mode */
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; max-width: 900px; width: 100%; margin: 0 auto; }
.mode {
  border-radius: 34px; padding: 26px 22px; min-height: 210px; box-shadow: var(--ombre);
  display: grid; justify-items: center; align-content: center; gap: 10px; text-align: center;
}
.mode .ico { font-size: 72px; line-height: 1; }
.mode .nom { font-size: clamp(30px, 5vw, 42px); font-weight: 700; }
.mode .sous { font-size: 18px; font-weight: 500; opacity: .85; }
.mode.timer { background: var(--orange); color: #fff; }
.mode.normal { background: var(--cadre); color: #fff; }
.mode:active { transform: translateY(4px); }

/* choix du temps */
.durees { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; max-width: 760px; width: 100%; margin: 0 auto; }
.duree {
  aspect-ratio: 1; max-width: 100%; border-radius: 26px; background: var(--papier); box-shadow: var(--ombre);
  display: grid; place-content: center; text-align: center; border: 5px solid transparent;
}
.duree b { font-size: clamp(36px, 8vw, 64px); line-height: 1; }
.duree span { font-size: clamp(13px, 2.4vw, 18px); color: var(--encre-douce); }
.duree[aria-pressed="true"] { border-color: var(--orange); background: #fff1e6; }
.durees.nombres { grid-template-columns: repeat(6, minmax(0, 1fr)); max-width: 900px; }
.nombres .duree b { font-size: clamp(26px, 5.2vw, 50px); }
.nombres .duree[data-v="new"] b { color: var(--orange); }
.nombres .duree[aria-pressed="true"] { border-color: var(--cadre); background: #eceeff; }
.duree[disabled] { opacity: .35; pointer-events: none; }
.puce.normal[aria-pressed="true"] { background: var(--cadre); }
.note { text-align: center; color: var(--encre-douce); font-size: 18px; font-weight: 500; }

/* jeu */
.jeu { flex: 1; display: grid; grid-template-rows: auto 1fr auto; gap: 16px; min-height: 0; }
.pastille { background: var(--papier); border-radius: 999px; padding: 10px 20px; font-size: clamp(24px, 4vw, 34px); font-weight: 700; box-shadow: var(--ombre); font-variant-numeric: tabular-nums; display: inline-flex; gap: 10px; align-items: center; }
.pastille.urgent { background: var(--faux); color: #fff; }
.scene { display: grid; place-items: center; min-height: 0; position: relative; }
.cadre-mot {
  background: var(--papier);
  border: clamp(8px, 1.4vw, 13px) solid var(--cadre);
  border-radius: clamp(26px, 4vw, 44px);
  /* taille fixe : seul le texte s'adapte à l'intérieur */
  width: min(88vw, 680px); height: clamp(170px, 34vh, 320px);
  padding: 0 clamp(18px, 4vw, 40px);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 10px 0 rgba(36,48,87,.14);
  font-family: var(--f-mot); color: #2f3433;
  line-height: 1.1; text-align: center; box-sizing: border-box; white-space: nowrap; overflow: hidden;
  transform: rotate(-1.5deg);
}
.cadre-mot.entre { animation: entre .28s ease-out; }
@keyframes entre { from { transform: rotate(-1.5deg) scale(.6); opacity: 0; } to { transform: rotate(-1.5deg) scale(1); opacity: 1; } }
.verdict { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.verdict span { font-size: clamp(120px, 26vw, 260px); font-weight: 700; line-height: 1; animation: tampon .45s ease-out forwards; }
.verdict.ok span { color: var(--vrai); }
.verdict.ko span { color: var(--faux); }
@keyframes tampon { 0% { transform: scale(2); opacity: 0; } 40% { transform: scale(1); opacity: .95; } 100% { transform: scale(1); opacity: 0; } }
.reponses { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(14px, 3vw, 30px); max-width: 820px; width: 100%; margin: 0 auto; }
.rep {
  min-height: clamp(110px, 18vh, 170px); border-radius: 34px; color: #fff;
  font-size: clamp(72px, 13vw, 120px); font-weight: 700; line-height: 1;
  display: grid; place-items: center;
}
.rep.v { background: var(--vrai); box-shadow: 0 8px 0 var(--vrai-fonce); }
.rep.x { background: var(--faux); box-shadow: 0 8px 0 var(--faux-fonce); }
.rep:active { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
.rep.v:active { box-shadow: 0 2px 0 var(--vrai-fonce); }
.rep.x:active { box-shadow: 0 2px 0 var(--faux-fonce); }

/* fin de partie */
.fin { flex: 1; display: grid; align-content: center; justify-items: center; gap: 22px; text-align: center; }
.medaille { font-size: 96px; line-height: 1; }
.bravo { font-size: clamp(44px, 10vw, 84px); color: var(--orange); text-shadow: 0 4px 0 rgba(36,48,87,.15); overflow-wrap: anywhere; animation: bravo .7s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes bravo { from { transform: scale(.3) rotate(-8deg); opacity: 0; } to { transform: scale(1) rotate(-2deg); opacity: 1; } }
.score-grand { font-size: clamp(80px, 18vw, 150px); font-weight: 700; line-height: .9; color: var(--vrai); font-variant-numeric: tabular-nums; }
.score-legende { font-size: clamp(22px, 4vw, 32px); font-weight: 600; }
.cases { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
.case { background: var(--papier); border-radius: 26px; box-shadow: var(--ombre); padding: 16px 24px; min-width: 130px; display: grid; gap: 2px; }
.case b { font-size: 48px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.case span { font-size: 18px; color: var(--encre-douce); font-weight: 600; }
.case.v b { color: var(--vrai); } .case.x b { color: var(--faux); } .case.t b { color: var(--cadre); }
.message { background: var(--papier); border: 5px solid var(--soleil); border-radius: 26px; padding: 16px 22px; font-size: clamp(20px, 3.6vw, 28px); font-weight: 600; max-width: 680px; }
.message.mieux { border-color: var(--vrai); }
.badge { background: var(--soleil); border-radius: 999px; padding: 8px 20px; font-size: 22px; font-weight: 700; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }

/* progrès */
.onglets { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.onglet { min-height: 60px; padding: 0 24px; border-radius: 20px; background: rgba(255,255,255,.6); font-size: 22px; font-weight: 600; }
.onglet[aria-pressed="true"] { background: var(--papier); box-shadow: var(--ombre); }
.onglet.timer[aria-pressed="true"] { color: var(--orange); }
.onglet.normal[aria-pressed="true"] { color: var(--cadre); }
.puces { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.puce { min-height: 52px; min-width: 76px; border-radius: 16px; background: rgba(255,255,255,.6); font-size: 20px; font-weight: 600; }
.puce[aria-pressed="true"] { background: var(--orange); color: #fff; }
.puce small, .onglet small { font-size: .75em; opacity: .75; }
.graphe { background: var(--papier); border-radius: 30px; box-shadow: var(--ombre); padding: 18px 12px 12px; overflow-x: auto; }
.graphe svg { display: block; height: auto; }
.graphe text { font-family: var(--f-titre); }
.vide { text-align: center; color: var(--encre-douce); font-size: 22px; padding: 40px 10px; display: grid; gap: 8px; }
.vide .ico { font-size: 64px; }
.resume { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

/* espace parents */
.parents { display: grid; gap: 18px; max-width: 820px; width: 100%; margin: 0 auto; }
.parents h3 { font-size: 24px; }
.parents .aide { color: var(--encre-douce); font-size: 17px; font-weight: 500; line-height: 1.45; font-family: system-ui, sans-serif; }
.parents ol { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.ligne { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ligne > input { flex: 1 1 260px; min-width: 0; }
.apercu { display: flex; flex-wrap: wrap; gap: 8px; max-height: 190px; overflow: auto; }
.apercu span { font-family: var(--f-mot); background: var(--ciel); border: 2px solid var(--cadre); border-radius: 10px; padding: 4px 10px; font-size: 18px; }
.statut { font-size: 17px; font-weight: 600; font-family: system-ui, sans-serif; }
.statut.ok { color: var(--vrai-fonce); } .statut.ko { color: var(--faux-fonce); }
.profil-ligne { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 8px 0; border-top: 2px dashed var(--ciel-2); }
.profil-ligne .qui { flex: 1 1 140px; min-width: 0; display: grid; gap: 2px; }
.profil-ligne .confirmer { flex: 1 1 100%; background: #fff1f1; border: 3px solid var(--faux); border-radius: 18px; padding: 14px 16px; display: grid; gap: 12px; }
.profil-ligne .confirmer p { font-size: 18px; font-weight: 500; line-height: 1.4; font-family: system-ui, sans-serif; }
.profil-ligne:first-of-type { border-top: 0; }
.profil-ligne .nom { min-width: 0; font-size: 22px; font-weight: 600; overflow-wrap: anywhere; }
.btn-danger { background: #ffe3e4; color: var(--faux-fonce); min-height: 52px; padding: 0 16px; border-radius: 16px; font-weight: 600; font-size: 17px; }
.btn-danger.arme { background: var(--faux); color: #fff; }
textarea { min-height: 150px; resize: vertical; }
.porte { display: grid; gap: 18px; justify-items: center; text-align: center; }
.porte .question { font-size: 44px; font-weight: 700; }
.porte .ligne { justify-content: center; }
.porte .ligne button { width: 90px; }

#toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  transform: translate(-50%, 140%); opacity: 0; transition: transform .3s, opacity .3s;
  background: var(--encre); color: #fff; font-size: 20px; font-weight: 600;
  padding: 14px 22px; border-radius: 20px; box-shadow: var(--ombre); max-width: calc(100% - 32px); text-align: center;
}
#toast.visible { transform: translate(-50%, 0); opacity: 1; }
#fete {
  position: fixed; inset: 0; z-index: 19; overflow: hidden; cursor: pointer;
  display: grid; place-items: center; text-align: center; color: #fff;
  padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(circle at 50% 38%, #4a3aa8 0%, #262a6b 45%, #141634 100%);
  animation: feteEntre .35s ease-out both;
}
#fete.sortie { animation: feteSort .45s ease-in forwards; }
@keyframes feteEntre { from { opacity: 0; } to { opacity: 1; } }
@keyframes feteSort { to { opacity: 0; transform: scale(1.08); } }
#fete .rayons {
  position: absolute; left: 50%; top: 38%; width: 240vmax; height: 240vmax; margin: -120vmax 0 0 -120vmax;
  background: repeating-conic-gradient(rgba(255, 214, 107, .14) 0 9deg, transparent 9deg 18deg);
  animation: tourne 16s linear infinite;
}
@keyframes tourne { to { transform: rotate(360deg); } }
#fete .etoiles { position: absolute; inset: 0; pointer-events: none; }
#fete .etoile { position: absolute; font-size: var(--t); animation: scintille 2.4s ease-in-out var(--d) infinite both; }
@keyframes scintille { 0%, 100% { opacity: .15; transform: scale(.6) rotate(0); } 50% { opacity: 1; transform: scale(1.2) rotate(25deg); } }
.fete-contenu { position: relative; display: grid; gap: clamp(10px, 2vh, 18px); justify-items: center; max-width: 900px; }
.fete-emoji { font-size: clamp(110px, 26vw, 220px); line-height: 1; filter: drop-shadow(0 12px 0 rgba(0,0,0,.3));
  animation: arrive .9s cubic-bezier(.3,1.7,.5,1) both, danse 2.2s ease-in-out 1s infinite; }
@keyframes arrive { from { transform: scale(0) rotate(-30deg); } to { transform: scale(1) rotate(0); } }
@keyframes danse { 0%, 100% { transform: rotate(-7deg) scale(1); } 50% { transform: rotate(7deg) scale(1.08); } }
.fete-titre { font-size: clamp(42px, 10.5vw, 108px); line-height: 1.05; margin: 0; }
.fete-titre .mot { display: inline-block; white-space: nowrap; }
.fete-titre .l { display: inline-block; text-shadow: 0 5px 0 rgba(0,0,0,.35);
  animation: lettre .6s cubic-bezier(.3,1.9,.5,1) both; animation-delay: calc(.35s + var(--i) * 55ms); }
.fete-titre .l:nth-child(5n+1) { color: #ffd36b; } .fete-titre .l:nth-child(5n+2) { color: #ff9a5a; }
.fete-titre .l:nth-child(5n+3) { color: #7ee8b8; } .fete-titre .l:nth-child(5n+4) { color: #ff9bd2; } .fete-titre .l:nth-child(5n) { color: #8fd3ff; }
@keyframes lettre { from { transform: translateY(-120px) scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
.fete-extra { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; justify-content: center; animation: monte .6s .9s both; }
.fete-grand { font-size: clamp(70px, 17vw, 150px); font-weight: 700; line-height: 1; color: #ffd36b; font-variant-numeric: tabular-nums; text-shadow: 0 6px 0 rgba(0,0,0,.35); }
.fete-legende { font-size: clamp(22px, 4vw, 34px); font-weight: 600; }
.fete-delta { background: var(--vrai); border-radius: 999px; padding: 10px 22px; font-size: clamp(19px, 3.4vw, 28px); font-weight: 700; box-shadow: 0 5px 0 var(--vrai-fonce);
  animation: monte .6s 1.4s both, pulse 1.1s ease-in-out 2s infinite; }
@keyframes pulse { 50% { transform: scale(1.07); } }
.fete-sous { font-size: clamp(20px, 3.8vw, 30px); font-weight: 600; max-width: 26ch; animation: monte .6s 1.7s both; }
.fete-touche { font-size: 17px; opacity: .7; animation: monte .6s 2.4s both; }
@keyframes monte { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
#confettis { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
@media (max-width: 520px) {
  .durees, .durees.nombres { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .rond, .espace { width: 56px; height: 56px; }
  .mode { min-height: 170px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; }
}
</style>

</head>
<body>
<div id="app"></div>
<canvas id="confettis"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(() => {
  "use strict";

  // ---------- stockage ----------
  const PREFIXE = "lam_";

  // ---------- feu d'artifice (quand l'enfant bat son score) ----------
  function feuArtifice(grand) {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const ctx = toile.getContext("2d"), dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
    toile.width = W * dpr; toile.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const fusees = [], etincelles = [], debut = performance.now(), DUREE = grand ? 6500 : 4200, force = grand ? 1.6 : 1;
    const tirs = Array.from({ length: grand ? 18 : 7 }, (_, i) => ({ t: i * (grand ? 340 : 450) + Math.random() * 200, x: W * (.08 + Math.random() * .84), y: H * (.08 + Math.random() * .4), c: COULEURS[i % COULEURS.length], parti: false }));
    function eclater(x, y, c) {
      const n = Math.round((60 + Math.random() * 30) * force);
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2, v = (2.2 + Math.random() * 3.2) * force;
        etincelles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vie: 1, c: Math.random() < .2 ? "#ffffff" : c, r: (2 + Math.random() * 2) * (grand ? 1.3 : 1) });
      }

    (function pas(t) {
      const e = t - debut;

      ctx.globalCompositeOperation = "source-over";

    })(debut);

  // ---------- synchronisation entre appareils (Google Apps Script) ----------
  const CODE_SYNCHRO = "/* Lis avec moi - synchronisation des profils et des resultats entre l'iPad et l'iPhone. A coller dans Extensions > Apps Script d'un Google Sheet, en remplacant tout le contenu. */\n\nvar ONGLETS = {\n  Profils: [\"id\", \"nom\", \"animal\", \"couleur\"],\n  Resultats: [\"id\", \"profil\", \"mode\", \"duree\", \"nombre\", \"justes\", \"faux\", \"total\", \"tempsMs\", \"date\"],\n  Supprimes: [\"id\"]\n};\n\nfunction feuille(nom) {\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  var f = ss.getSheetByName(nom);\n  if (!f) {\n    f = ss.insertSheet(nom);\n    f.getRange(\"A:Z\").setNumberFormat(\"@\");\n    f.appendRow(ONGLETS[nom]);\n  }\n  return f;\n}\n\nfunction lireTout(nom) {\n  var valeurs = feuille(nom).getDataRange().getValues();\n  var titres = valeurs.shift();\n  var liste = [];\n  for (var i = 0; i < valeurs.length; i++) {\n    if (valeurs[i][0] === \"\") continue;\n    var o = {};\n    for (var j = 0; j < titres.length; j++) o[titres[j]] = valeurs[i][j];\n    liste.push(o);\n  }\n  return liste;\n}\n\nfunction etat() {\n  var sup = lireTout(\"Supprimes\");\n  var ids = [];\n  for (var i = 0; i < sup.length; i++) ids.push(String(sup[i].id));\n  return { ok: true, profils: lireTout(\"Profils\"), resultats: lireTout(\"Resultats\"), supprimes: ids };\n}\n\nfunction repondre(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\n\nfunction doGet() {\n  return repondre(etat());\n}\n\nfunction ajouter(nom, liste) {\n  if (!liste || !liste.length) return;\n  var f = feuille(nom);\n  var existants = lireTout(nom);\n  var deja = {};\n  for (var i = 0; i < existants.length; i++) deja[String(existants[i].id)] = true;\n  var colonnes = ONGLETS[nom];\n  var lignes = [];\n  for (var k = 0; k < liste.length; k++) {\n    var o = liste[k];\n    if (deja[String(o.id)]) continue;\n    var ligne = [];\n    for (var c = 0; c < colonnes.length; c++) {\n      var v = o[colonnes[c]];\n      ligne.push(v === null || v === undefined ? \"\" : String(v));\n    }\n    lignes.push(ligne);\n    deja[String(o.id)] = true;\n  }\n  if (lignes.length) f.getRange(f.getLastRow() + 1, 1, lignes.length, colonnes.length).setValues(lignes);\n}\n\nfunction retirer(ids) {\n  if (!ids || !ids.length) return;\n  var aRetirer = {};\n  for (var i = 0; i < ids.length; i++) aRetirer[String(ids[i])] = true;\n  var f = feuille(\"Resultats\");\n  var valeurs = f.getDataRange().getValues();\n  for (var l = valeurs.length - 1; l >= 1; l--) {\n    if (aRetirer[String(valeurs[l][0])]) f.deleteRow(l + 1);\n  }\n}\n\nfunction doPost(e) {\n  var verrou = LockService.getScriptLock();\n  verrou.waitLock(20000);\n  try {\n    var d = JSON.parse(e.postData.contents);\n    var sup = [];\n    var ids = d.supprimes || [];\n    for (var i = 0; i < ids.length; i++) sup.push({ id: ids[i] });\n    ajouter(\"Profils\", d.profils);\n    ajouter(\"Resultats\", d.resultats);\n    ajouter(\"Supprimes\", sup);\n    retirer(d.retirer);\n    return repondre(etat());\n  } finally {\n    verrou.releaseLock();\n  }\n}\n";
  const normProfil = o => ({ id: String(o.id), nom: String(o.nom), animal: String(o.animal), couleur: String(o.couleur) });
  const vide = v => v === "" || v == null;
  const normResultat = o => ({

  function fusionner(srv) {

    const P = new Map(), R = new Map();
    [...srv.profils.map(normProfil), ...profils].forEach(p => { if (!P.has(p.id)) P.set(p.id, p); });
    [...srv.resultats.map(normResultat), ...resultats].forEach(r => { if (!R.has(r.id)) R.set(r.id, r); });
    // Même prénom créé sur deux appareils : on garde le profil le plus ancien et on regroupe les résultats
    const alias = {}, garde = {};
    const ps = [...P.values()].filter(p => !sup.has(p.id)).sort((a, b) => a.id < b.id ? -1 : 1).filter(p => {
      const k = p.nom.trim().toLowerCase();
      if (garde[k]) { alias[p.id] = garde[k].id; return false; }
      garde[k] = p; return true;
    });
    const rs = [...R.values()].map(r => alias[r.profil] ? { ...r, profil: alias[r.profil] } : r)
      .filter(r => !sup.has(r.profil)).sort((a, b) => a.date < b.date ? -1 : 1);
    return { ps, rs, alias };
  }
  async function appelSynchro(corps) {
    const rep = corps
      ? await fetch(lienSynchro, { method: "POST", body: JSON.stringify(corps), redirect: "follow" })
      : await fetch(lienSynchro + "?t=" + Date.now(), { cache: "no-store", redirect: "follow" });
    const d = await rep.json();
    if (!d || !d.ok) throw new Error("réponse");
    return d;
  }
  // ---------- tri des résultats ----------
  // Chaque jour à 6 h : on ne garde que le meilleur résultat de la veille (par enfant, mode, durée ou nombre de mots).
  // Le 1er du mois à 6 h : on ne garde que les 5 meilleurs résultats du mois précédent.
  // La règle ne dépend que des résultats eux-mêmes : tous les appareils arrivent au même tri.
  const meilleurDabord = (a, b) => a.mode === "timer"
    ? (b.justes - a.justes) || (a.faux - b.faux) || (a.date < b.date ? -1 : 1)
    : (taux(b) - taux(a)) || (a.tempsMs - b.tempsMs) || (a.date < b.date ? -1 : 1);
  function compacter(liste, maintenant) {
    const now = maintenant || new Date();
    const finDuJour = d => new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, 6);   // lendemain 6 h
    const finDuMois = d => new Date(d.getFullYear(), d.getMonth() + 1, 1, 6);            // 1er du mois suivant 6 h
    const cle = r => r.profil + "|" + r.mode + "|" + varianteDe(r);
    const regrouper = (l, k) => l.reduce((g, r) => { (g[k(r)] = g[k(r)] || []).push(r); return g; }, {});
    // 1) un seul résultat par jour terminé
    const jours = regrouper(liste, r => { const d = new Date(r.date); return finDuJour(d) <= now ? cle(r) + "|" + d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate() : "garder|" + r.id; });
    const apresJour = Object.values(jours).map(g => g.sort(meilleurDabord)[0]);
    // 2) cinq résultats par mois terminé
    const mois = regrouper(apresJour, r => { const d = new Date(r.date); return finDuMois(d) <= now ? cle(r) + "|" + d.getFullYear() + "-" + d.getMonth() : "garder|" + r.id; });
    const garde = new Set(Object.values(mois).flatMap(g => g.sort(meilleurDabord).slice(0, 5)).map(r => r.id));
    return liste.filter(r => garde.has(r.id));
  }
  // Applique le tri sur cet appareil ; renvoie les identifiants retirés
  function trierResultats() {
    const avant = resultats;
    resultats = compacter(resultats);
    if (resultats.length === avant.length) return [];
    sauverResultats();
    const restants = new Set(resultats.map(r => r.id));
    return avant.filter(r => !restants.has(r.id)).map(r => r.id);
  }

  // ---------- petits messages en bas de l'écran ----------
  let minuteurToast = null;
  function toast(texte) {
    let t = document.getElementById("toast");
    if (!t) { t = document.createElement("div"); t.id = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = texte; t.classList.add("visible");
    clearTimeout(minuteurToast); minuteurToast = setTimeout(() => t.classList.remove("visible"), 3500);
  }

  let synchroEnCours = false, synchroRelance = false;
  async function synchroniser() {
    if (!lienSynchro) return;
    if (synchroEnCours) { synchroRelance = true; return; }
    synchroEnCours = true;
    try {
      let srv = await appelSynchro();
      const ids = l => new Set(l.map(x => String(x.id)));
      const sp = ids(srv.profils), sr = ids(srv.resultats), ss = new Set(srv.supprimes.map(String));
      const envoi = { profils: profils.filter(p => !sp.has(p.id)), resultats: resultats.filter(r => !sr.has(r.id)), supprimes: supprimes.filter(id => !ss.has(id)) };
      if (envoi.profils.length || envoi.resultats.length || envoi.supprimes.length) srv = await appelSynchro(envoi);
      const avant = new Set(profils.map(p => p.id));
      const { ps, rs, alias } = fusionner(srv);
      profils = ps; resultats = rs; sauverProfils(); sauverResultats();
      const retires = trierResultats();
      const surServeur = new Set(srv.resultats.map(r => String(r.id)));
      const aRetirer = retires.filter(id => surServeur.has(id));
      if (aRetirer.length) appelSynchro({ profils: [], resultats: [], supprimes: [], retirer: aRetirer }).catch(() => {});
      const nouveaux = profils.filter(p => !avant.has(p.id) && !Object.values(alias).includes(p.id));
      if (nouveaux.length && avant.size) toast((nouveaux.length > 1 ? "Nouveaux profils : " : "Nouveau profil : ") + nouveaux.map(p => p.animal + " " + p.nom).join(", "));
      if (profil) profil = profils.find(p => p.id === (alias[profil.id] || profil.id)) || null;
      etatSynchro = { ok: true, date: new Date().toISOString(), texte: "" };
    } catch (e) {
      etatSynchro = { ok: false, date: etatSynchro && etatSynchro.date, texte: "Synchronisation impossible pour l'instant. Les résultats sont gardés sur cet appareil et seront envoyés plus tard." };
    } finally {
      ecrire("etatSynchro", etatSynchro);
      synchroEnCours = false;
      if (!profil && !["profils", "parents", "porte", "nouveau"].includes(ecran)) aller("profils");
      else if (["profils", "parents", "progres", "modes"].includes(ecran)) afficher();
      if (synchroRelance) { synchroRelance = false; synchroniser(); }
    }
  }

      else if (r.justes === prec.justes) message = `Pareil que la dernière fois (${prec.justes}). Bien joué !`;

  function grapheBarres(points, opts) {
    // points: [{valeur, etiquette, sous, record}]
    const n = points.length, pas = 74, gauche = 18, haut = 46, hauteur = 230, bas = 58;
    const L = Math.max(240, gauche * 2 + n * pas), H = haut + hauteur + bas;
    const max = Math.max(opts.max || 1, ...points.map(p => p.valeur));
    const y = v => haut + hauteur - (v / max) * hauteur;
    const lignes = [0.25, 0.5, 0.75, 1].map(f => `<line x1="${gauche}" x2="${L - gauche}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="#d8f3ee" stroke-width="2" stroke-dasharray="6 6"/>`).join("");
    const barres = points.map((p, i) => {
      const cx = gauche + pas * i + pas / 2, w = 48, yb = y(p.valeur), h = Math.max(6, haut + hauteur - yb);
      const c = COULEURS[i % COULEURS.length];
      return `
        <rect x="${cx - w / 2}" y="${haut + hauteur - h}" width="${w}" height="${h}" rx="14" fill="${c}"/>
        <rect x="${cx - w / 2 + 8}" y="${haut + hauteur - h + 8}" width="10" height="${Math.max(0, h - 22)}" rx="5" fill="#ffffff" opacity=".35"/>
        ${p.record ? `<text x="${cx}" y="${haut + hauteur - h - 30}" text-anchor="middle" font-size="24">⭐</text>` : ""}
        <text x="${cx}" y="${haut + hauteur - h - 8}" text-anchor="middle" font-size="20" font-weight="700" fill="#243057">${p.etiquette}</text>
        <text x="${cx}" y="${haut + hauteur + 26}" text-anchor="middle" font-size="16" fill="#5a6488">${p.date}</text>
        ${p.sous ? `<text x="${cx}" y="${haut + hauteur + 48}" text-anchor="middle" font-size="15" font-weight="600" fill="#7176d6">${p.sous}</text>` : ""}`;
    }).join("");
    return `<svg viewBox="0 0 ${L} ${H}" width="${L}" style="max-width:none;width:${L}px" role="img" aria-label="${esc(opts.titre)}">
      ${lignes}<line x1="${gauche}" x2="${L - gauche}" y1="${haut + hauteur}" y2="${haut + hauteur}" stroke="#243057" stroke-width="3" stroke-linecap="round"/>${barres}</svg>`;
  }

      return `
      <div class="profil-ligne">${avatarProfil(p)}
        <div class="qui"><span class="nom">${esc(p.nom)}</span><span class="aide">${n} partie${n > 1 ? "s" : ""}</span></div>
        ${suppressionArmee === p.id ? "" : `<button class="btn-danger" data-a="supprimerProfil" data-id="${p.id}">Supprimer</button>`}
        ${suppressionArmee === p.id ? `
        <div class="confirmer">
          <p>Supprimer <b>${esc(p.nom)}</b> et ${n > 1 ? "ses " + n + " parties" : n ? "sa partie" : "son profil"} ?${lienSynchro ? " Ce sera aussi effacé sur les autres appareils." : ""}</p>
          <div class="ligne"><button class="btn-danger arme" data-a="supprimerProfil" data-id="${p.id}">Oui, supprimer</button><button class="gros blanc petit" data-a="annulerSuppression">Annuler</button></div>
        </div>` : ""}
      </div>`;
    }).join("") || `<p class="aide">Aucun profil pour l'instant.</p>`;
    return `
      ${barre(retour("versProfils"), "<h2>Espace parents</h2>")}
      <div class="parents" style="padding-top:12px">
        <section class="panneau">
          <h3>Mots et lettres à lire</h3>
          <p class="aide"><b>${mots.length}</b> mots et lettres · ${esc(source.libelle)}${maj}</p>
          <div class="apercu">${mots.map(m => `<span>${esc(m)}</span>`).join("")}</div>
          ${statutMots ? `<p class="statut ${statutMots.ok ? "ok" : "ko"}">${esc(statutMots.texte)}</p>` : ""}
        </section>

        <section class="panneau">
          <h3>Depuis un Google Sheet (conseillé)</h3>
          <ol class="aide">
            <li>Créez un Google Sheet et écrivez un mot ou une lettre par ligne dans la <b>colonne A</b>.</li>
            <li>Cliquez sur <b>Partager</b>, puis choisissez « Tous les utilisateurs disposant du lien » en lecture.</li>
            <li>Collez le lien ici. L'app relit la liste à chaque ouverture.</li>
          </ol>
          <div class="ligne">
            <input id="lienSheet" type="url" placeholder="https://docs.google.com/spreadsheets/d/…" value="${esc(lienSheet)}" autocomplete="off">
            <button class="gros bleu petit" data-a="chargerSheet">Charger</button>
          </div>
        </section>

        <section class="panneau">
          <h3>Depuis un fichier Excel ou CSV</h3>
          <p class="aide">Un mot ou une lettre par ligne dans la colonne A. La liste actuelle est remplacée.</p>
          <div class="ligne"><label class="gros blanc petit" for="fichierMots" style="cursor:pointer">📄 Choisir un fichier</label>
            <input id="fichierMots" type="file" accept=".xlsx,.xls,.ods,.csv,.txt" hidden></div>
        </section>

        <section class="panneau">
          <h3>Écrire la liste à la main</h3>
          <p class="aide">Un mot ou une lettre par ligne.</p>
          <textarea id="listeManuelle">${esc(mots.join("\n"))}</textarea>
          <div class="ligne"><button class="gros bleu petit" data-a="enregistrerListe">Enregistrer la liste</button></div>
        </section>

        <section class="panneau">
          <h3>Profils (${profils.length}/${MAX_PROFILS})</h3>
          <p class="aide">Supprimer un profil efface aussi tous ses résultats.</p>
          ${lignesProfils}
        </section>

        <section class="panneau">
          <h3>Synchroniser l'iPad et l'iPhone</h3>
          ${lienSynchro ? `
            <p class="statut ${etatSynchro && !etatSynchro.ok ? "ko" : "ok"}">${etatSynchro && !etatSynchro.ok ? esc(etatSynchro.texte) : etatSynchro && etatSynchro.date ? "✓ Synchronisé le " + new Date(etatSynchro.date).toLocaleDateString("fr-BE") + " à " + new Date(etatSynchro.date).toLocaleTimeString("fr-BE", { hour: "2-digit", minute: "2-digit" }) : "Connexion…"}</p>
            <p class="aide">Les profils et les résultats sont partagés avec tous les appareils connectés au même lien.</p>
            <div class="ligne"><button class="gros bleu petit" data-a="synchroMaintenant">🔄 Synchroniser maintenant</button><button class="btn-danger" data-a="deconnecterSynchro">Déconnecter</button></div>`
          : `
            <p class="aide">Pour retrouver les mêmes profils et progrès sur tous vos appareils (5 minutes, une seule fois, de préférence sur un ordinateur) :</p>
            <ol class="aide">
              <li>Créez un nouveau Google Sheet, par exemple « Lis avec moi – résultats ».</li>
              <li>Menu <b>Extensions → Apps Script</b>. Effacez le contenu et collez le code ci-dessous.</li>
              <li><b>Déployer → Nouveau déploiement</b>, type <b>Application Web</b>. « Exécuter en tant que » : <b>Moi</b>, « Qui a accès » : <b>Tout le monde</b>. Cliquez sur Déployer et autorisez l'accès.</li>
              <li>Copiez l'<b>URL de l'application Web</b> (elle finit par /exec) et collez-la ici, sur chaque appareil.</li>
            </ol>
            <div class="ligne"><button class="gros blanc petit" data-a="copierCode">📋 Copier le code</button></div>
            <textarea id="codeSynchro" readonly hidden>${esc(CODE_SYNCHRO)}</textarea>
            <div class="ligne">
              <input id="lienSynchro" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
              <button class="gros bleu petit" data-a="connecterSynchro">Connecter</button>
            </div>
            ${etatSynchro && !etatSynchro.ok ? `<p class="statut ko">${esc(etatSynchro.texte)}</p>` : ""}`}
        </section>

        <section class="panneau">
          <h3>Sons</h3>
          <div class="ligne"><button class="gros petit ${sonActif ? "vert" : "blanc"}" data-a="son">${sonActif ? "🔊 Sons activés" : "🔇 Sons coupés"}</button></div>
        </section>
      </div>`;
  }

  // ---------- rendu ----------
  function afficher() {
    const vues = { profils: vueProfils, nouveau: vueNouveauProfil, modes: vueModes, timer: vueTimer, normal: vueNormal, jeu: vueJeu, fin: vueFin, progres: vueProgres, porte: vuePorte, parents: vueParents };
    app.innerHTML = vues[ecran]();
    if (ecran === "jeu") montrerMot();
    if (ecran === "progres") { const g = app.querySelector(".graphe"); if (g) g.scrollLeft = g.scrollWidth; }
    if (ecran === "nouveau") {
      const champ = document.getElementById("nomProfil");
      const maj = () => { brouillon.nom = champ.value; document.getElementById("btnCreer").disabled = !champ.value.trim(); };
      champ.addEventListener("input", maj); maj();
    }
    if (ecran === "parents") {
      document.getElementById("fichierMots").addEventListener("change", e => { const f = e.target.files[0]; if (f) lireFichier(f); });
    }
  }
  const aller = e => { ecran = e; window.scrollTo(0, 0); afficher(); };

  // ---------- partie ----------
  let verrou = null;
  async function garderEcranAllume() { try { verrou = await navigator.wakeLock.request("screen"); } catch (e) {} }
  function lacherEcran() { try { verrou && verrou.release(); } catch (e) {} verrou = null; }

  function demarrer(mode) {
    if (!mots.length) return;
    if (mode === "normal" && !nombrePossible(nombreChoisi)) nombreChoisi = "tout";
    const nombre = mode === "normal" ? nombreChoisi : null;
    const pile = mode !== "normal" || nombre === "tout" ? melanger(mots)
      : nombre === "new" ? melanger(mots.slice(-NB_NEW))
      : melanger(mots).slice(0, nombre);
    partie = {
      mode, duree: mode === "timer" ? dureeChoisie : null, nombre,
      pile, index: 0, total: pile.length, mot: null,
      justes: 0, faux: 0, debut: Date.now(), occupe: false, minuteur: null, arretArme: false
    };
    partie.mot = partie.pile[0];
    aller("jeu");
    garderEcranAllume();
    if (mode === "timer") partie.minuteur = setInterval(tic, 200);
  }
  function tic() {
    const reste = partie.duree * 60000 - (Date.now() - partie.debut);
    const el = document.getElementById("chronoTxt");
    if (el) { el.textContent = mmss(reste); document.getElementById("chrono").classList.toggle("urgent", reste <= 10000); }
    if (reste <= 0) terminer();
  }
  function montrerMot() {
    const el = document.getElementById("mot");
    if (!el || !partie) return;
    // le cadre garde toujours la même taille : on ajuste seulement la taille du texte
    const st = getComputedStyle(el);
    const largeur = el.clientWidth - parseFloat(st.paddingLeft) - parseFloat(st.paddingRight), hauteur = el.clientHeight;
    const taille = Math.max(24, Math.min(hauteur * 0.62, largeur / (partie.mot.length * 0.56 + 0.2)));
    el.style.fontSize = taille + "px";
    el.textContent = partie.mot;
    el.classList.remove("entre"); void el.offsetWidth; el.classList.add("entre");
    const c = document.getElementById("compteur"); if (c) c.textContent = (partie.index + 1) + " / " + partie.total;
  }
  function repondre(juste) {
    if (!partie || partie.occupe) return;
    partie.occupe = true;
    juste ? partie.justes++ : partie.faux++;
    bip(juste ? "ok" : "ko");
    const v = document.getElementById("verdict");
    v.className = "verdict " + (juste ? "ok" : "ko"); v.innerHTML = `<span>${juste ? "V" : "X"}</span>`;
    setTimeout(() => {
      if (!partie) return;
      v.innerHTML = ""; partie.occupe = false;
      partie.index++;
      if (partie.index >= partie.pile.length) {
        if (partie.mode === "normal") return terminer();
        // Timer : on remélange, sans répéter le dernier mot tout de suite
        const dernier = partie.mot; let p = melanger(mots);
        if (p.length > 1 && p[0] === dernier) p.push(p.shift());
        partie.pile = partie.pile.concat(p);
      }
      partie.mot = partie.pile[partie.index];
      montrerMot();
    }, 380);
  }
  function terminer() {
    if (!partie) return;
    clearInterval(partie.minuteur); lacherEcran();
    const p = partie; partie = null;
    const tempsMs = p.mode === "timer" ? p.duree * 60000 : Date.now() - p.debut;
    const r = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), profil: profil.id, mode: p.mode, duree: p.duree, nombre: p.nombre, justes: p.justes, faux: p.faux, total: p.justes + p.faux, tempsMs, date: new Date().toISOString() };
    const anciens = resultatsDe(profil.id, p.mode, p.mode === "timer" ? p.duree : p.nombre);
    const precedent = anciens[anciens.length - 1] || null;
    const record = anciens.length > 0 && [...anciens, r].sort(meilleurDabord)[0] === r;
    resultats.push(r); sauverResultats(); synchroniser();
    fin = { resultat: r, precedent, record };
    aller("fin");
    const mieux = precedent && (p.mode === "timer" ? r.justes > precedent.justes : (taux(r) > taux(precedent) || (taux(r) === taux(precedent) && r.tempsMs < precedent.tempsMs - 1000)));
    const nom = profil.nom, pc = Math.round(taux(r) * 100);
    const valeur = p.mode === "timer" ? { valeur: r.justes, legende: r.justes > 1 ? "mots justes" : "mot juste" } : { valeur: pc, suffixe: " %", legende: "de bonnes réponses" };
    let delta = "";
    if (precedent && mieux) {
      if (p.mode === "timer") { const d = r.justes - precedent.justes; delta = "+" + d + (d > 1 ? " mots" : " mot") + " par rapport à la dernière fois"; }
      else if (pc > Math.round(taux(precedent) * 100)) delta = "+" + (pc - Math.round(taux(precedent) * 100)) + " % de bonnes réponses";
      else delta = tempsEnMots(precedent.tempsMs - r.tempsMs) + " plus rapide !";
    }
    if (record) grandeFete({ emoji: "🏆", titre: "Nouveau record !", sous: nom + ", tu n'as jamais fait aussi bien. Tu es une vraie star !", delta, parole: "Bravo " + nom + " ! Nouveau record !", ...valeur });
    else if (mieux) grandeFete({ emoji: "🚀", titre: "Super " + nom + " !", sous: "Tu as fait mieux que la dernière fois. Continue comme ça !", delta, parole: "Super " + nom + " ! Tu as fait mieux que la dernière fois !", ...valeur });
    else if (!precedent) grandeFete({ emoji: "🌟", titre: "Bravo " + nom + " !", sous: "Ta toute première partie : c'est un super début !", parole: "Bravo " + nom + " ! C'est un super début !", ...valeur });
    else setTimeout(() => dire("Bravo " + nom + " !"), 500);
  }
  function arreter() {
    if (!partie) return;
    if (!partie.arretArme) {
      partie.arretArme = true;
      const b = document.getElementById("btnArreter"); b.textContent = "Sûr ?"; b.style.fontSize = "18px"; b.style.background = "#ffe3e4";
      setTimeout(() => { if (partie && partie.arretArme) { partie.arretArme = false; b.textContent = "✖️"; b.style.fontSize = ""; b.style.background = ""; } }, 2500);
      return;
    }
    clearInterval(partie.minuteur); lacherEcran(); partie = null; aller("modes");
  }

  // ---------- actions ----------
  const actions = {
    versProfils() { profil = null; statutMots = null; suppressionArmee = null; aller("profils"); synchroniser(); },
    choisirProfil(el) { profil = profils.find(p => p.id === el.dataset.id); etatProgres = { mode: null, duree: null }; aller("modes"); },
    nouveauProfil() {
      const pris = profils.map(p => p.animal);
      brouillon = { nom: "", animal: ANIMAUX.find(a => !pris.includes(a)) || ANIMAUX[0], couleur: COULEURS[profils.length % COULEURS.length] };
      aller("nouveau");
      setTimeout(() => { const c = document.getElementById("nomProfil"); c && c.focus(); }, 50);
    },
    animal(el) { brouillon.animal = el.dataset.v; afficher(); },
    couleur(el) { brouillon.couleur = el.dataset.v; afficher(); },
    creerProfil() {
      const nom = brouillon.nom.trim(); if (!nom || profils.length >= MAX_PROFILS) return;
      profil = { id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), nom, animal: brouillon.animal, couleur: brouillon.couleur };
      profils.push(profil); sauverProfils(); bip("ok"); aller("modes"); synchroniser();
    },
    versModes() { aller("modes"); },
    versTimer() { aller("timer"); },
    duree(el) { dureeChoisie = Number(el.dataset.v); ecrire("duree", dureeChoisie); afficher(); },
    lancerTimer() { demarrer("timer"); },
    versNormal() { aller("normal"); },
    nombre(el) { nombreChoisi = nombreLire(el.dataset.v); ecrire("nombre", nombreChoisi); afficher(); },
    lancerNormal() { demarrer("normal"); },
    repondre(el) { repondre(el.dataset.v === "1"); },
    arreter,
    versProgres() { etatProgres = { mode: null, duree: null }; aller("progres"); },
    progresMode(el) { etatProgres.mode = el.dataset.v; afficher(); },
    progresNombre(el) { etatProgres.nombre = nombreLire(el.dataset.v); afficher(); },
    progresDuree(el) { etatProgres.duree = Number(el.dataset.v); afficher(); },
    ouvrirPorte() {
      const a = 2 + Math.floor(Math.random() * 7), b = 3 + Math.floor(Math.random() * 6), bon = a * b;
      const choix = new Set([bon]); while (choix.size < 3) choix.add(bon + (Math.floor(Math.random() * 11) - 5) || bon + 7);
      porte = { a, b, bon, choix: melanger([...choix]) };
      aller("porte");
    },
    porteRep(el) { if (Number(el.dataset.v) === porte.bon) { statutMots = null; aller("parents"); } else actions.ouvrirPorte(); },
    async chargerSheet() {
      lienSheet = document.getElementById("lienSheet").value.trim(); ecrire("lienSheet", lienSheet);
      statutMots = { ok: true, texte: "Chargement…" }; afficher();
      await chargerSheet(lienSheet, false); afficher();
    },
    enregistrerListe() {
      const ok = appliquerMots(document.getElementById("listeManuelle").value.split(/\r?\n/), { type: "manuel", libelle: "Liste écrite à la main", maj: new Date().toISOString() });
      if (ok) { lienSheet = ""; ecrire("lienSheet", ""); }
      statutMots = ok ? { ok: true, texte: "Liste enregistrée : " + mots.length + " mots et lettres." } : { ok: false, texte: "La liste est vide." };
      afficher();
    },
    annulerSuppression() { suppressionArmee = null; afficher(); },
    supprimerProfil(el) {
      const id = el.dataset.id;
      if (suppressionArmee !== id) { suppressionArmee = id; return afficher(); }
      profils = profils.filter(p => p.id !== id); resultats = resultats.filter(r => r.profil !== id);
      if (lienSynchro && !supprimes.includes(id)) { supprimes.push(id); ecrire("supprimes", supprimes); }
      sauverProfils(); sauverResultats(); suppressionArmee = null; afficher(); synchroniser();
    },
    async connecterSynchro() {
      const lien = document.getElementById("lienSynchro").value.trim();
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/.test(lien)) {
        etatSynchro = { ok: false, date: null, texte: "Ce lien ne ressemble pas à un lien d'application Web Google (il doit finir par /exec)." };
        return afficher();
      }
      lienSynchro = lien; ecrire("lienSynchro", lienSynchro);
      etatSynchro = { ok: true, date: null, texte: "Connexion…" }; afficher();
      await synchroniser();
    },
    synchroMaintenant() { synchroniser(); },
    deconnecterSynchro() { lienSynchro = ""; ecrire("lienSynchro", ""); etatSynchro = null; ecrire("etatSynchro", null); afficher(); },
    async copierCode(el) {
      try { await navigator.clipboard.writeText(CODE_SYNCHRO); el.textContent = "✓ Code copié"; }
      catch (e) { const t = document.getElementById("codeSynchro"); t.hidden = false; t.select(); el.textContent = "Sélectionnez et copiez le code ci-dessous"; }
    },
    son() { sonActif = !sonActif; ecrire("son", sonActif); afficher(); }
  };

  app.addEventListener("click", e => {
    const el = e.target.closest("[data-a]");
    if (!el || el.disabled) return;
    const f = actions[el.dataset.a]; if (f) f(el);
  });
  document.addEventListener("keydown", e => {
    if (ecran !== "jeu") return;
    if (e.key === "v" || e.key === "V" || e.key === "ArrowLeft") repondre(true);
    if (e.key === "x" || e.key === "X" || e.key === "ArrowRight") repondre(false);
  });
  addEventListener("resize", () => { if (ecran === "jeu") { const el = document.getElementById("mot"); if (el && partie) el.style.fontSize = ""; montrerMot(); } });
  // À chaque ouverture (et à chaque retour dans l'app) : tri des résultats, nouveaux profils, nouveaux mots
  function verifier() {
    if (trierResultats().length && ["progres", "modes"].includes(ecran)) afficher();
    synchroniser();
    if (lienSheet) chargerSheet(lienSheet, true).then(ok => { if (ok && ["parents", "modes", "normal"].includes(ecran)) afficher(); });
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    if (partie) garderEcranAllume(); else verifier();
  });

  afficher();
  verifier();
})();
</script>

<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
